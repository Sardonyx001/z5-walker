<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>z5 walker</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Courier New", monospace;
        background-color: #111827;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 2rem;
      }

      .container {
        background-color: #1f2937;
        border-radius: 0.5rem;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        padding: 2rem;
        width: 100%;
        max-width: 28rem;
      }

      canvas {
        width: 100%;
        max-width: 24rem;
        border: 4px solid #4b5563;
        border-radius: 0.5rem;
        margin-bottom: 2rem;
        background-color: #000;
        display: block;
        margin-left: auto;
        margin-right: auto;
        image-rendering: pixelated;
        image-rendering: -moz-crisp-edges;
        image-rendering: crisp-edges;
      }

      .stats {
        color: #9ca3af;
        font-size: 0.875rem;
        margin-bottom: 2rem;
        list-style: none;
      }

      .stats li {
        margin-bottom: 0.25rem;
      }

      .stats span {
        color: #e5e7eb;
      }

      .button-group {
        display: flex;
        gap: 0.75rem;
      }

      button {
        flex: 1;
        font-family: "Courier New", monospace;
        font-weight: bold;
        font-size: 1.125rem;
        padding: 0.75rem 1rem;
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
        transition: background-color 0.2s;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      .generate-btn {
        background-color: #374151;
        color: white;
      }

      .generate-btn:hover:not(:disabled) {
        background-color: #4b5563;
      }

      .generate-btn:disabled {
        background-color: #374151;
      }

      .download-btn {
        background-color: #4b5563;
        color: white;
      }

      .download-btn:hover {
        background-color: #6b7280;
      }

      .description {
        color: #9ca3af;
        font-size: 0.875rem;
        text-align: center;
        margin-bottom: 1.5rem;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="description">
        generate a colorful image via a random walk in Z5 (H,S,V,x,y)
      </p>
      <canvas id="canvas" width="256" height="256"></canvas>

      <ul class="stats">
        <li>Coverage: <span id="coverage">0.0%</span></li>
        <li>Steps: <span id="steps">0</span></li>
      </ul>

      <div class="button-group">
        <button class="generate-btn" id="generateBtn">Generate</button>
        <button class="download-btn" id="downloadBtn">Download</button>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("canvas");
      const ctx = canvas.getContext("2d", { alpha: false });
      const coverageEl = document.getElementById("coverage");
      const stepsEl = document.getElementById("steps");
      const generateBtn = document.getElementById("generateBtn");
      const downloadBtn = document.getElementById("downloadBtn");

      const WIDTH = 256;
      const HEIGHT = 256;
      const CHUNK_STEPS = 2000000;
      const MAX_TOTAL_STEPS = 50000000;

      let isGenerating = false;

      async function generateImage() {
        if (isGenerating) return;

        isGenerating = true;
        generateBtn.disabled = true;
        coverageEl.textContent = "0.0%";
        stepsEl.textContent = "0";

        const imageData = ctx.createImageData(WIDTH, HEIGHT);
        const imgData = imageData.data;
        const visited = new Uint8Array(WIDTH * HEIGHT);
        const totalPixels = WIDTH * HEIGHT;

        // Pre-compute HSV lookup table
        const hsvLut = new Uint8Array(256 * 256 * 3);
        for (let h = 0; h < 256; h++) {
          const hNorm = h / 255.0;
          const h6 = hNorm * 6.0;
          const i = h6 | 0;
          const f = h6 - i;

          for (let s = 0; s < 256; s++) {
            const sNorm = s / 255.0;
            const p = 255 * (1 - sNorm);
            const q = 255 * (1 - sNorm * f);
            const t = 255 * (1 - sNorm * (1 - f));

            let r, g, b;
            const ii = i % 6;
            if (ii === 0) {
              r = 255;
              g = t;
              b = p;
            } else if (ii === 1) {
              r = q;
              g = 255;
              b = p;
            } else if (ii === 2) {
              r = p;
              g = 255;
              b = t;
            } else if (ii === 3) {
              r = p;
              g = q;
              b = 255;
            } else if (ii === 4) {
              r = t;
              g = p;
              b = 255;
            } else {
              r = 255;
              g = p;
              b = q;
            }

            const idx = (h * 256 + s) * 3;
            hsvLut[idx] = r | 0;
            hsvLut[idx + 1] = g | 0;
            hsvLut[idx + 2] = b | 0;
          }
        }

        let h = 0,
          s = 0,
          v = 0,
          x = 0,
          y = 0;
        let totalSteps = 0;
        let coveredPixels = 0;
        let lastUpdateTime = performance.now();

        while (coveredPixels < totalPixels && totalSteps < MAX_TOTAL_STEPS) {
          const n = Math.min(CHUNK_STEPS, MAX_TOTAL_STEPS - totalSteps);

          for (let i = 0; i < n; i++) {
            const dim = (Math.random() * 5) | 0;
            const sign = Math.random() < 0.5 ? -1 : 1;

            if (dim === 0) h += sign;
            else if (dim === 1) s += sign;
            else if (dim === 2) v += sign;
            else if (dim === 3) x += sign;
            else y += sign;

            const col = ((x % WIDTH) + WIDTH) % WIDTH;
            const row = ((-y % HEIGHT) + HEIGHT) % HEIGHT;
            const pixelIdx = row * WIDTH + col;

            const h8 = (((((h % 360) + 360) % 360) / 360) * 255) | 0;
            const s8 = (((((s % 100) + 100) % 100) / 100) * 255) | 0;
            const v8 = (((((v % 100) + 100) % 100) / 100) * 255) | 0;

            if (visited[pixelIdx] === 0) {
              visited[pixelIdx] = 1;
              coveredPixels++;
            }

            const lutIdx = (h8 * 256 + s8) * 3;
            const r = hsvLut[lutIdx];
            const g = hsvLut[lutIdx + 1];
            const b = hsvLut[lutIdx + 2];

            const vf = v8 / 255;

            const imgIdx = pixelIdx * 4;
            imgData[imgIdx] = (r * vf) | 0;
            imgData[imgIdx + 1] = (g * vf) | 0;
            imgData[imgIdx + 2] = (b * vf) | 0;
            imgData[imgIdx + 3] = 255;
          }

          totalSteps += n;

          const now = performance.now();
          if (now - lastUpdateTime > 250) {
            coverageEl.textContent =
              ((coveredPixels / totalPixels) * 100).toFixed(1) + "%";
            stepsEl.textContent = totalSteps.toLocaleString();
            lastUpdateTime = now;
            ctx.putImageData(imageData, 0, 0);
            await new Promise((resolve) => setTimeout(resolve, 0));
          }
        }

        ctx.putImageData(imageData, 0, 0);
        coverageEl.textContent =
          ((coveredPixels / totalPixels) * 100).toFixed(1) + "%";
        stepsEl.textContent = totalSteps.toLocaleString();

        isGenerating = false;
        generateBtn.disabled = false;
      }

      function downloadImage() {
        const link = document.createElement("a");
        link.href = canvas.toDataURL("image/png");
        link.download = "random-walk.png";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      }

      generateBtn.addEventListener("click", generateImage);
      downloadBtn.addEventListener("click", downloadImage);
    </script>
  </body>
</html>
